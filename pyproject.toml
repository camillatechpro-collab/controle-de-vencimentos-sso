[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controle-vencimentos-sst"
version = "1.0.0"
description = "Controle de Vencimentos - Área de Segurança do Trabalho"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.50,<2",
    "SQLAlchemy>=2.0.30,<2.1",
    "pandas>=2.2",
    "plotly>=5.22",
    "reportlab>=4.2",
    "openpyxl>=3.1.2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
